<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TikTok Recharge</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #f8f8f8;
            color: #121212;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .balance-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .balance-title {
            font-size: 13px;
            color: #8a8b91;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: #121212;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .coins-amount {
            font-size: 14px;
            color: #fe2c55;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .input-group {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .input-label {
            font-size: 12px;
            color: #8a8b91;
            margin-bottom: 6px;
            display: block;
        }

        .input-field {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            color: #121212;
            direction: ltr;
            text-align: right;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #121212;
            margin-top: 8px;
        }

        .coins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .coin-option {
            background: #ffffff;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .coin-option.selected {
            border-color: #fe2c55;
            background: #fff5f7;
        }

        .coin-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .coin-count {
            font-size: 16px;
            font-weight: 700;
            color: #121212;
        }

        .exchange-btn {
            background: #fe2c55;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3);
            cursor: pointer;
        }

        .exchange-btn:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(18, 18, 18, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">تم استبدال العملات بنجاح!</div>

    <div class="balance-card">
        <div class="balance-title">Simulated Earnings Balance</div>
        <div class="balance-amount" id="balanceAmount">$978,467,740</div>
        <div class="coins-amount">
            🪙 <span id="coinsAmount">99,840,000</span> Coins Available
        </div>
    </div>

    <div class="input-group">
        <label class="input-label">TikTok username</label>
        <input type="text" id="username" class="input-field" placeholder="@username" value="@anis12">
    </div>

    <div class="section-title">Exchange earnings for Coins</div>

    <div class="coins-grid">
        <div class="coin-option selected" onclick="selectOption(this, 350, 3.5)">
            <div class="coin-icon">🪙</div>
            <div class="coin-count">350</div>
        </div>
        <div class="coin-option" onclick="selectOption(this, 500, 5.0)">
            <div class="coin-icon">🪙</div>
            <div class="coin-count">500</div>
        </div>
        <div class="coin-option" onclick="selectOption(this, 15000, 150.0)">
            <div class="coin-icon">🪙</div>
            <div class="coin-count">15,000</div>
        </div>
    </div>

    <button class="exchange-btn" onclick="processExchange()">Exchange Coins</button>

    <script>
        let currentBalance = 978467740;
        let currentCoins = 99840000;
        let selectedCoins = 350;
        let selectedCost = 3.5;

        function selectOption(element, coins, cost) {
            document.querySelectorAll('.coin-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedCoins = coins;
            selectedCost = cost;
        }

        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        function processExchange() {
            const usernameInput = document.getElementById('username').value.trim();
            
            if (!usernameInput) {
                alert('الرجاء كتابة اسم المستخدم أولاً');
                return;
            }

            if (currentCoins >= selectedCoins) {
                currentCoins -= selectedCoins;
                currentBalance -= selectedCost;

                document.getElementById('balanceAmount').innerText = '$' + formatNumber(Math.round(currentBalance));
                document.getElementById('coinsAmount').innerText = formatNumber(currentCoins);

                showToast(`تم تحويل ${formatNumber(selectedCoins)} عملة إلى ${usernameInput}`);
            } else {
                alert('الرصيد غير كافي');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
