<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok LIVE Rewards</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col justify-between select-none">

    <!-- Header Section -->
    <header class="bg-white px-4 py-3 border-b border-gray-200 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <i class="fa-brands fa-tiktok text-xl"></i>
            <span class="font-bold text-base tracking-tight">LIVE Rewards</span>
        </div>
        <button class="text-gray-400 text-lg hover:text-gray-600">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-4 flex-1">

        <!-- Top Upgrades Cards (Floating Options) -->
        <div class="grid grid-cols-3 gap-2 mb-4 text-center">
            <div class="bg-white p-2.5 rounded-xl border border-gray-200 shadow-sm flex flex-col items-center">
                <i class="fa-solid fa-gem text-blue-500 mb-1 text-sm"></i>
                <span class="text-[10px] font-bold text-gray-700 leading-tight">Priority processing</span>
            </div>
            <div class="bg-white p-2.5 rounded-xl border border-gray-200 shadow-sm flex flex-col items-center">
                <i class="fa-solid fa-box text-pink-500 mb-1 text-sm"></i>
                <span class="text-[10px] font-bold text-gray-700 leading-tight">Cut in line</span>
            </div>
            <div class="bg-white p-2.5 rounded-xl border border-gray-200 shadow-sm flex flex-col items-center">
                <i class="fa-solid fa-bolt text-indigo-500 mb-1 text-sm"></i>
                <span class="text-[10px] font-bold text-gray-700 leading-tight">Instant transfer</span>
            </div>
        </div>

        <!-- Simulated Account Balance Display -->
        <div class="bg-white rounded-2xl p-5 mb-5 border border-gray-200 shadow-sm text-center">
            <p class="text-xs text-gray-500 font-medium mb-1">Simulated Earnings Balance</p>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-1" id="balanceAmount">$978,467,740</h1>
            <p class="text-xs text-amber-500 font-semibold flex items-center justify-center gap-1">
                <i class="fa-solid fa-coins text-amber-400"></i>
                <span id="coinsCounter">99,840,000 Coins Available</span>
            </p>
        </div>

        <!-- Inputs Section -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">TikTok username</label>
                <input type="text" id="usernameInput" placeholder="@username" value="@yoy4x7" class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-tiktokRed focus:border-transparent">
            </div>

            <!-- Exchange Options -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">Exchange earnings for Coins</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectCoins(350, this)" class="coin-btn bg-white border-2 border-rose-500 rounded-xl p-3 text-center hover:border-rose-500 transition shadow-sm">
                        <div class="text-amber-400 mb-0.5"><i class="fa-solid fa-coins"></i></div>
                        <div class="font-bold text-sm text-gray-800">350</div>
                    </button>
                    <button onclick="selectCoins(500, this)" class="coin-btn bg-white border border-gray-200 rounded-xl p-3 text-center hover:border-rose-500 transition shadow-sm">
                        <div class="text-amber-400 mb-0.5"><i class="fa-solid fa-coins"></i></div>
                        <div class="font-bold text-sm text-gray-800">500</div>
                    </button>
                    <button onclick="selectCoins(15000, this)" class="coin-btn bg-white border border-gray-200 rounded-xl p-3 text-center hover:border-rose-500 transition shadow-sm">
                        <div class="text-amber-400 mb-0.5"><i class="fa-solid fa-coins"></i></div>
                        <div class="font-bold text-sm text-gray-800">15,000</div>
                    </button>
                </div>
            </div>

            <!-- Progress Simulation Bar -->
            <div id="progressBox" class="hidden bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm">
                <div class="flex justify-between text-xs mb-1.5">
                    <span id="statusLabel" class="text-gray-600 font-medium">Connecting...</span>
                    <span id="percentLabel" class="font-bold text-rose-500">0%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-rose-500 h-full w-0 transition-all duration-200"></div>
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="runSimulation()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-[0.98] text-sm">
                Exchange Coins
            </button>
        </div>

    </main>

    <script>
        let selectedAmount = 350;

        function selectCoins(amount, btn) {
            selectedAmount = amount;
            document.querySelectorAll('.coin-btn').forEach(b => {
                b.classList.remove('border-2', 'border-rose-500');
                b.classList.add('border', 'border-gray-200');
            });
            btn.classList.remove('border-gray-200');
            btn.classList.add('border-2', 'border-rose-500');
        }

        function runSimulation() {
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            const percentLabel = document.getElementById('percentLabel');
            const statusLabel = document.getElementById('statusLabel');

            progressBox.classList.remove('hidden');
            let progress = 0;

            const timer = setInterval(() => {
                progress += 5;
                progressBar.style.width = progress + '%';
                percentLabel.textContent = progress + '%';

                if(progress === 25) statusLabel.textContent = "Validating username...";
                if(progress === 55) statusLabel.textContent = "Processing transaction...";
                if(progress === 85) statusLabel.textContent = "Finalizing coin injection...";

                if(progress >= 100) {
                    clearInterval(timer);
                    statusLabel.textContent = "Coins Transferred!";
                    setTimeout(() => {
                        progressBox.classList.add('hidden');
                        progressBar.style.width = '0%';
                    }, 1500);
                }
            }, 100);
        }
    </script>
</body>
</html>
